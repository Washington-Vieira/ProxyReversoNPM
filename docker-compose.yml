services:
  npm:
    image: 'jc21/nginx-proxy-manager:latest'
    container_name: nginx-proxy-manager
    restart: unless-stopped
    ports:
      # Tráfego HTTP público (sites que você vai expor)
      - '80:80'
      # Painel de administração web (acesse em http://IP_DA_VPS:81)
      - '81:81'
      # Tráfego HTTPS público (SSL/Let's Encrypt)
      - '443:443'
    environment:
      # Fuso horário (ajuda nos logs e na renovação de certificados)
      TZ: 'America/Sao_Paulo'
      # Desativa coleta de métricas (opcional)
      # DISABLE_IPV6: 'true'   # descomente se sua VPS não tiver IPv6
    volumes:
      # Banco de dados (SQLite), configs de hosts e certificados ficam aqui
      - ./data:/data
      - ./letsencrypt:/etc/letsencrypt
    healthcheck:
      test: ["CMD", "/usr/bin/check-health"]
      interval: 30s
      timeout: 10s
      retries: 3
